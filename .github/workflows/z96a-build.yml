name: Z96A kernel and board build

on:
  push:
    branches:
      - z96a-niri
    paths:
      - core/linux-aarch64/**
      - alarm/z96a-typec-post-install/**
      - core/archlinuxarm-keyring/**
    tags:
      - z96a-kernel-ci-*
      - z96a-v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out kernel and board sources
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            alarm/z96a-typec-post-install
            core/archlinuxarm-keyring
            core/linux-aarch64

      - name: Bootstrap Arch Linux ARM
        run: bash .github/scripts/bootstrap-alarm.sh

      - name: Prepare package builder
        run: sudo chroot "$ALARM_ROOT" /usr/bin/bash /work/.github/scripts/build-in-alarm.sh prepare

      - name: Build Linux kernel, modules and DTBs
        run: sudo chroot "$ALARM_ROOT" /usr/bin/bash /work/.github/scripts/build-in-alarm.sh kernel

      - name: Build Z96A board package
        run: sudo chroot "$ALARM_ROOT" /usr/bin/bash /work/.github/scripts/build-in-alarm.sh board

      - name: Upload kernel and board artifacts
        uses: actions/upload-artifact@v4
        with:
          name: z96a-aarch64-platform
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  desktop:
    if: startsWith(github.ref, 'refs/tags/z96a-v')
    uses: ./.github/workflows/z96a-niri.yml

  release:
    if: startsWith(github.ref, 'refs/tags/z96a-v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download kernel and board artifacts
        uses: actions/download-artifact@v4
        with:
          name: z96a-aarch64-platform
          path: dist

      - name: Download Niri profile artifact
        uses: actions/download-artifact@v4
        with:
          name: z96a-niri-profile
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pkg.tar.zst \
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
