name: Z96A Rockchip BSP kernel

on:
  push:
    branches:
      - z96a-niri
      - z96a-bsp-niri-image
    tags:
      - z96a-bsp-v*
    paths:
      - core/linux-rockchip-z96a/**
      - .github/workflows/z96a-bsp-kernel.yml
      - .github/scripts/bootstrap-alarm.sh
      - .github/scripts/build-z96a-image.sh
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Reuse a verified BSP package from this workflow run and rebuild the image
        required: false
        type: string
      image_profile:
        description: Minimal console image or the SDDM and Niri desktop image
        required: true
        default: minimal
        type: choice
        options:
          - minimal
          - niri

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.kernel_run_id == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out BSP package and build support
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            core/archlinuxarm-keyring
            core/linux-rockchip-z96a

      - name: Bootstrap Arch Linux ARM
        run: bash .github/scripts/bootstrap-alarm.sh
        env:
          ALARM_MIRROR: https://ca.us.mirror.archlinuxarm.org

      - name: Prepare package builder
        run: sudo chroot "$ALARM_ROOT" /usr/bin/bash /work/.github/scripts/build-in-alarm.sh prepare

      - name: Prepare pinned BSP and export patch bundle
        run: |
          sudo chroot "$ALARM_ROOT" /usr/bin/runuser -u builder -- env \
            HOME=/home/builder PKGDEST=/work/dist \
            /usr/bin/makepkg --syncdeps --cleanbuild --nobuild --noconfirm \
            --dir /work/core/linux-rockchip-z96a
          sudo chroot "$ALARM_ROOT" /usr/bin/runuser -u builder -- env \
            HOME=/home/builder /usr/bin/bash /work/core/linux-rockchip-z96a/export-patches.sh \
            /work/core/linux-rockchip-z96a /work/core/linux-rockchip-z96a/src/rockchip-linux-kernel /work/dist

      - name: Build pinned BSP kernel package
        run: |
          sudo chroot "$ALARM_ROOT" /usr/bin/runuser -u builder -- env \
            HOME=/home/builder MAKEFLAGS=-j2 \
            PACKAGER='Z96A BSP GitHub Actions <actions@users.noreply.github.com>' \
            PKGEXT=.pkg.tar.xz PKGDEST=/work/dist \
            /usr/bin/makepkg --noextract --clean --noconfirm \
            --dir /work/core/linux-rockchip-z96a
          shopt -s nullglob
          packages=(dist/linux-rockchip-z96a-*.pkg.tar.xz)
          test "${#packages[@]}" -eq 1
          echo "BSP_PACKAGE=/work/${packages[0]}" >> "$GITHUB_ENV"
          (cd dist && sha256sum "${packages[0]##*/}" > BSP-SHA256SUMS)

      - name: Verify package paths, config, driver modules and BSP DTB
        run: >-
          sudo chroot "$ALARM_ROOT" /usr/bin/bash
          /work/core/linux-rockchip-z96a/verify-package.sh
          "$BSP_PACKAGE"

      - name: Exercise package installation and initramfs preset in CI rootfs
        run: >-
          sudo chroot "$ALARM_ROOT" /usr/bin/bash
          /work/core/linux-rockchip-z96a/verify-install.sh "$BSP_PACKAGE"

      - name: Upload BSP package artifact
        uses: actions/upload-artifact@v4
        with:
          name: z96a-rockchip-bsp61
          path: |
            dist/linux-rockchip-z96a-*.pkg.tar.xz
            dist/BSP-SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload the complete BSP source changes
        uses: actions/upload-artifact@v4
        with:
          name: z96a-bsp-patches
          path: dist/z96a-bsp-patches.tar.xz
          if-no-files-found: error
          retention-days: 30

  flash-image:
    needs: build
    if: >-
      !cancelled() && vars.Z96A_ALLOW_IMAGE_ARTIFACTS == 'true' &&
      (needs.build.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.kernel_run_id != ''))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ALARM_MIRROR: https://ca.us.mirror.archlinuxarm.org
      KERNEL_BUILD_RUN_ID: ${{ inputs.kernel_run_id || github.run_id }}
      IMAGE_PROFILE: ${{ inputs.image_profile || (github.ref == 'refs/heads/z96a-bsp-niri-image' && 'niri') || 'minimal' }}
    steps:
      - name: Check out image build and documentation
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            core/archlinuxarm-keyring
            core/linux-rockchip-z96a

      - name: Download the verified BSP package from this build
        if: github.event_name != 'workflow_dispatch' || inputs.kernel_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: z96a-rockchip-bsp61
          path: dist

      - name: Check the selected BSP build run
        if: github.event_name == 'workflow_dispatch' && inputs.kernel_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$KERNEL_BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KERNEL_BUILD_RUN_ID" --jq '.path')
          [[ "$workflow" == .github/workflows/z96a-bsp-kernel.yml ]]
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KERNEL_BUILD_RUN_ID/jobs"             --jq '.jobs[] | select(.name == "build") | .conclusion')
          [[ "$result" == success ]]

      - name: Download the verified BSP package from the selected build
        if: github.event_name == 'workflow_dispatch' && inputs.kernel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: z96a-rockchip-bsp61
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.kernel_run_id }}

      - name: Check the kernel package digest
        working-directory: dist
        run: sha256sum -c BSP-SHA256SUMS

      - name: Install host filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler dosfstools e2fsprogs gcc libc6-dev libarchive-tools mtools xz-utils util-linux

      - name: Bootstrap a clean Arch Linux ARM filesystem
        run: bash .github/scripts/bootstrap-alarm.sh

      - name: Fetch an approved LBA0 boot-firmware input
        id: lba0-prefix
        if: vars.Z96A_LBA0_PREFIX_URL != ''
        env:
          PREFIX_URL: ${{ vars.Z96A_LBA0_PREFIX_URL }}
        run: |
          prefix="$RUNNER_TEMP/z96a-preboot-190464lba.bin.xz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --max-time 60 \
            --output "$prefix" -- "$PREFIX_URL"
          echo "path=$prefix" >> "$GITHUB_OUTPUT"

      - name: Build and validate flash images
        env:
          Z96A_LBA0_PREFIX: ${{ steps.lba0-prefix.outputs.path }}
        run: |
          mkdir -p dist/flash-image
          args=()
          if [[ -n "$Z96A_LBA0_PREFIX" ]]; then
            mkdir -p dist/flash-image-lba0
            args+=(dist/flash-image-lba0)
          fi
          bash .github/scripts/build-z96a-image.sh "$ALARM_ROOT" \
            dist/linux-rockchip-z96a-*.pkg.tar.xz dist/flash-image "$IMAGE_PROFILE" "${args[@]}"

      - name: Upload RKDevTool image and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_PROFILE == 'niri' && 'z96a-rockchip-flash-image-niri' || 'z96a-rockchip-flash-image' }}
          path: dist/flash-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete LBA0 eMMC image
        if: steps.lba0-prefix.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_PROFILE == 'niri' && 'z96a-rockchip-flash-image-niri-lba0' || 'z96a-rockchip-flash-image-lba0' }}
          path: dist/flash-image-lba0/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
